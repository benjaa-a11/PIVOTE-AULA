name: Android APK validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Keep this Flutter version aligned with the Gradle 8.14 toolchain below.
      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      # Gradle's wrapper downloader does not retry HTTP failures on Gradle 8.x.
      # Download through the direct distribution host with curl retries, then
      # place the verified archive in the exact cache location used by the wrapper.
      - name: Download and cache Gradle distribution
        shell: bash
        env:
          GRADLE_VERSION: "8.14.8"
          GRADLE_DISTRIBUTION_URL: "https://downloads.gradle.org/distributions/gradle-8.14.8-bin.zip"
          GRADLE_DISTRIBUTION_SHA256: "94da89692fc3ca6d2d0ce6bb48548762ea0f1897ba444286f5c7f3759c7af651"
        run: |
          set -euo pipefail

          GRADLE_HASH="$(python3 - "$GRADLE_DISTRIBUTION_URL" <<'PY'
          import hashlib
          import sys

          digest = hashlib.md5(sys.argv[1].encode("utf-8")).digest()
          number = int.from_bytes(digest, "big")
          alphabet = "0123456789abcdefghijklmnopqrstuvwxyz"
          result = ""
          while number:
              number, remainder = divmod(number, 36)
              result = alphabet[remainder] + result
          print(result or "0")
          PY
          )"

          GRADLE_HOME_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
          GRADLE_CACHE_DIR="$GRADLE_HOME_DIR/wrapper/dists/gradle-${GRADLE_VERSION}-bin/$GRADLE_HASH"
          GRADLE_ZIP="$GRADLE_CACHE_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$GRADLE_CACHE_DIR"

          if [[ -f "$GRADLE_ZIP" ]] && echo "$GRADLE_DISTRIBUTION_SHA256  $GRADLE_ZIP" | sha256sum --check --status; then
            echo "A verified Gradle distribution is already cached."
          else
            rm -f "$GRADLE_ZIP"
            curl --fail --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 900 \
              "$GRADLE_DISTRIBUTION_URL" \
              --output "$GRADLE_ZIP"
            echo "$GRADLE_DISTRIBUTION_SHA256  $GRADLE_ZIP" | sha256sum --check --strict
          fi

      - name: Install SQLite native library for unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        id: analyze
        run: flutter analyze --no-pub --no-fatal-infos
        continue-on-error: true

      - name: Run Flutter tests
        id: tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Build release APK
        id: build_apk
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-pub

      - name: Upload release APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pivo-aula-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation results
        if: always()
        shell: bash
        run: |
          failed=0
          if [[ "${{ steps.analyze.outcome }}" != "success" ]]; then
            echo "::error::Dart analysis failed."
            failed=1
          fi
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "::error::Flutter tests failed."
            failed=1
          fi
          if [[ "${{ steps.build_apk.outcome }}" != "success" ]]; then
            echo "::error::Release APK build failed."
            failed=1
          fi
          exit "$failed"
